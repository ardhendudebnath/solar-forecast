[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solarcast"
dynamic = ["version"]
description = "Short-term solar PV power forecasting on real plant data, judged against honest baselines."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ardhendu Debnath" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pvlib>=0.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.dynamic]
version = { attr = "solarcast.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
